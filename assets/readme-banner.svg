<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Deadlinks</title><desc id="d">A link checker follows document links and identifies broken destinations.</desc><defs><linearGradient id="bg"><stop stop-color="#19283d"/><stop offset="1" stop-color="#0a111d"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><g fill="#142b43" stroke="#62e3c1" stroke-width="3"><rect x="105" y="105" width="180" height="90" rx="12"/><rect x="470" y="65" width="180" height="90" rx="12"/><rect x="470" y="175" width="180" height="90" rx="12"/></g><g fill="#edf3ff" font-family="monospace" font-size="16" text-anchor="middle"><text x="195" y="158">MARKDOWN</text><text x="560" y="118">200 OK</text><text x="560" y="228">404 FOUND</text></g><path d="M285 150H380V110H470M380 150V220H470" fill="none" stroke="#8fa8ff" stroke-width="3" stroke-dasharray="8 8"><animate attributeName="stroke-dashoffset" values="0;-64" dur="2.4s" repeatCount="indefinite"/></path><circle cx="850" cy="150" r="62" fill="#142b43" stroke="#ffc77a" stroke-width="3"/><path d="M825 125L875 175M875 125L825 175" stroke="#ffc77a" stroke-width="6" stroke-linecap="round"><animate attributeName="opacity" values=".4;1;.4" dur="2s" repeatCount="indefinite"/></path><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">DEADLINKS</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">CRAWL / CHECK / REPORT</text></svg>